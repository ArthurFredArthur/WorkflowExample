name: Exercice 3.3 - Téléchargement d'artefacts

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Lancer le lint
        run: echo "Vérification du style du code (Linter)..."

  build:
    name: Construction & Artefact
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Simuler la compilation
        run: |
          echo "Compilation en cours..."
          echo "Rapport de build réussi" > build-report.txt

      - name: Sauvegarder le rapport
        uses: actions/upload-artifact@v4
        with:
          name: mon-artefact
          path: build-report.txt

  unit-tests:
    name: Tests Unitaires (Node v${{ matrix.node-version }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

  
      - name: Executer les tests unitaires
        run: |
          echo "Exécution des tests avec Node.js version ${{ matrix.node-version }}"
          node -v
          echo "10 tests unitaires exécutés : 10 réussis, 0 échoués"

  security-check:
    name: Vérification Sécurisée (Secrets)
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Utiliser un secret masqué
        env:
          MY_SECRET_TOKEN: ${{ secrets.MON_SUPER_SECRET }}
        run: |
          echo "Connexion au service distant avec le token sécurisé..."
          if [ -n "$MY_SECRET_TOKEN" ]; then
            echo "Token personnalisé détecté et injecté avec succès."
          else
            echo "Aucun secret personnalisé configuré (tu peux en ajouter un dans les paramètres du dépôt)."
          fi

  test:
    name: Téléchargement et Vérification de l'Artefact
    needs: [security-check]
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger l'artefact
        uses: actions/download-artifact@v4
        with:
          name: mon-artefact

      - name: Afficher le contenu du rapport
        run: |
          echo "Affichage du contenu du fichier récupéré :"
          cat build-report.txt
