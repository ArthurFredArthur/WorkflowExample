name: hello Workflow
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
env:
  NOM: Atangana luc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: show date
        run:   date "+%Y-%m-%d %H:%M:%S"
      - name: show username
        run: whoami
      - name: free space available
        run: df -h 
      - name: welcome ${{env.NOM}}
        run: echo 'Hi ${{env.NOM}}'
