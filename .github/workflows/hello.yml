name: Exercice 2.1 - Jobs Séquentiels

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: recuperation du depot
        uses: actions/checkout@v4
      - name: lancer les lint
        run: echo "Vérification du style du code (Linter)..."
  build:
    name: Construction
    runs-on: ubuntu-latest
    steps:
      - name: Simuler la compilation
        run: echo "Compilation en cours..."

  test:
    name: Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Simuler les tests
        run: echo "Tests en cours (le build a réussi !)"
